<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch Pro - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav>
            <img src="/Reposição/img/CineMatch-Logo.jpg" width="50%" alt="CineMatch Pro" class="CineMatch-Logo">
            <a href="index.html">Cadastro</a>
            <a href="catalogo.html">Minha Videoteca</a>
            <a href="https://www.imdb.com/chart/top/" target="_blank">Sugestões IMDb</a>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastrar Novo Filme</h1>
            <form id="form-filme">
                
                <div class="input-group">
                    <label for="titulo">Título do Filme:</label>
                    <input type="text" id="titulo" required>
                </div>

                <div class="input-group">
                    <label for="capaUrl">URL da Capa da Imagem:</label>
                    <input type="url" id="capaUrl" required>
                </div>

                <div class="input-group">
                    <label for="trailerId">ID do Trailer (YouTube):</label>
                    <input type="text" id="trailerId" required>
                </div>

                <div class="input-group">
                    <label for="duracao">Duração (em minutos):</label>
                    <input type="number" id="duracao" required>
                </div>

                <button type="submit">Salvar no Catálogo</button>
            </form>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
