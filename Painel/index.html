<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média SENAI</title>
    <link rel="stylesheet" href='style.css'>
</head>
<body>
    <div>
        <img src="/img/SENAI_São_Paulo_logo.png" width="100" alt="Logo Senai" class="Logo">
    
        <h2>Calculadora de Média SENAI</h2>
    
<label for="nome">Nome do Aluno:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">

        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" placeholder="0">

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" placeholder="0">

        <button onclick="processarDados()">Calcular</button>

        <div id="resultado"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
