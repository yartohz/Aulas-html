<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Hidráulico</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/Monitoramento de Pressão Hidráulica/style.css">
</head>
<body>

<div class="container py-4">

    <h1 class="text-center titulo">
        CENTRAL DE MONITORAMENTO - UNIDADE 04
    </h1>

 <div class="card painel">

    <div class="card-header text-center">
        <h2>🏭 PRENSA HIDRÁULICA H5</h2>
        <p>Monitoramento em Tempo Real</p>
    </div>

    <div class="card-body">

        <div class="indicadores">

            <div class="indicador">
                <h5>🌐 Rede</h5>
                <span id="statusBadge"
                class="badge bg-secondary">
                    AGUARDANDO
                </span>
            </div>

            <div class="indicador">
                <h5>⚙ Equipamento</h5>
                <span class="badge bg-primary">
                    PRENSA H5
                </span>
            </div>

        </div>

        <div class="displayPressao">

            <div class="manometro">
                🧭
            </div>

            <span id="valorPressao">
                0 BAR
            </span>

            <p>PRESSÃO DO SISTEMA</p>

        </div>

        <div class="text-center">

            <div id="loading"
            class="spinner-border text-info d-none">
            </div>

        </div>

        <div class="progress mt-4">

            <div id="barraPressao"
            class="progress-bar"
            style="width:0%">
            </div>

        </div>

        <div id="statusPressao"
        class="status-operacao">

            AGUARDANDO LEITURA

        </div>

    </div>

</div>

            <hr>

            <div class="displayPressao">
                <span id="valorPressao">
                    0.0 BAR
                </span>
            </div>

            <div class="text-center">

                <div id="loading"
                class="spinner-border text-info d-none">
                </div>

            </div>

            <div class="progress mt-4">

                <div id="barraPressao"
                class="progress-bar bg-success"
                style="width:0%">
                </div>

            </div>

        </div>

    </div>

    <div id="mensagemErro"
    class="alert alert-danger mt-3 d-none">
    </div>

    <div class="text-center mt-4">

        <button class="btn btn-info btn-lg"
        onclick="monitorarPressao()">

            SINCRONIZAR SENSOR

        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
